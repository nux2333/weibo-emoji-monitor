name: Apply History zero-post stop once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply-history-zero-stop.py
      - run: |
          if git diff --quiet -- src/superlike/monitor-scanner.js; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/superlike/monitor-scanner.js
          git commit -m "fix: stop History after 3 zero-post pages"
          git push
