name: One shot reset history resume
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-reset-history-resume.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch history resume reset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scanner = Path('src/superlike/monitor-scanner.js')
          s = scanner.read_text(encoding='utf-8')
          old = """        if (\n          consecutiveZeroPostPages\n          >= HISTORY_ZERO_POST_THRESHOLD\n        ) {\n          clearScanResume(\n            monitor.id\n          );\n\n          console.log(\n            `[SuperLike][History][空扫停止] 连续 ${HISTORY_ZERO_POST_THRESHOLD} 页 Post=0，清除 latest-posts Resume 并结束 History。`\n          );\n\n          break;\n        }\n"""
          new = """        if (\n          consecutiveZeroPostPages\n          >= HISTORY_ZERO_POST_THRESHOLD\n        ) {\n          saveScanResume(\n            monitor.id,\n            checkpoint,\n            latestResume.sort_time_flow_id\n            || sortTimeFlowId,\n            latestResume.template_url\n            || sortTimeRequestTemplateUrl,\n            {\n              page: 1,\n              since_id: null,\n              max_id: '0'\n            }\n          );\n\n          console.log(\n            `[SuperLike][History][空扫停止] 连续 ${HISTORY_ZERO_POST_THRESHOLD} 页 Post=0，Resume 已重置到 page=1 并清空 cursor，本轮 History 结束。`\n          );\n\n          break;\n        }\n"""
          if old not in s:
              raise SystemExit('scanner anchor not found')
          scanner.write_text(s.replace(old, new, 1), encoding='utf-8')

          db = Path('src/db.js')
          d = db.read_text(encoding='utf-8')
          old2 = """    || !nextParams\n    || Number(nextParams.page) < 2\n"""
          new2 = """    || !nextParams\n    || Number(nextParams.page) < 1\n"""
          if old2 not in d:
              raise SystemExit('db anchor not found')
          db.write_text(d.replace(old2, new2, 1), encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/superlike/monitor-scanner.js src/db.js
          git commit -m 'fix: reset History resume after empty pages'
          git push
