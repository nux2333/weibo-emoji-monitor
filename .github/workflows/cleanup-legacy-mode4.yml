name: Cleanup legacy Mode4

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-legacy-mode4.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy Mode4 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/recheck-superlike.js')
          s = p.read_text(encoding='utf-8')

          start_marker = """/**
 * ============================================================
 * 模式4：直接读取超LIKE List，只取 UID，批量删除 DB
"""
          end_marker = """/**
 * ============================================================
 * 模式2/3常驻轮询
"""

          start = s.find(start_marker)
          end = s.find(end_marker, start + 1 if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('legacy Mode4 block markers not found')

          s = s[:start] + """/**
 * Mode4 已迁移到 scripts/recheck-superlike-mode4-http.js。
 * 旧的浏览器常驻分页实现已删除，避免重复维护两套 Mode4。
 */

""" + s[end:]

          old = """  if (mode === '4') {
    await runMode4Forever();
    return;
  }
"""
          new = """  if (mode === '4') {
    throw new Error(
      'Mode4 已迁移到 scripts/recheck-superlike-mode4-http-entry.js，请通过 PM2 的 superlike-mode4 启动。'
    );
  }
"""
          if old not in s:
              raise SystemExit('legacy Mode4 main entry not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          node --check scripts/recheck-superlike.js
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/recheck-superlike.js
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove legacy Mode4 browser implementation'
          git push
