<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>实时日志</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container wide">
  <header class="page-header">
    <div>
      <h1>实时日志</h1>
      <p><span id="dot" class="live-dot"></span><span id="status">未连接</span> · <span id="file">-</span></p>
    </div>
    <div class="actions">
      <a class="button" href="/admin">返回后台</a>
      <button class="button" id="pauseBtn" onclick="togglePause()">暂停滚动</button>
      <button class="button" onclick="clearView()">清空画面</button>
    </div>
  </header>

  <section class="card">
    <div class="row">
      <input id="filter" placeholder="筛选，例如 Fresh进度 / 新增 / ERROR / Checkpoint" oninput="render()">
      <label><input id="autoScroll" type="checkbox" checked> 自动滚动</label>
    </div>
  </section>

  <div class="log-layout">
    <section class="card log-card">
      <pre id="log" class="live-log">请从右侧选择日志文件。</pre>
    </section>

    <aside class="card log-browser">
      <div class="log-browser-head">
        <strong>日志目录</strong>
        <button class="button" onclick="loadDirectory(currentDir)">刷新</button>
      </div>
      <div id="breadcrumb" class="log-breadcrumb"></div>
      <div id="tree" class="log-tree">请输入管理员 Token 后加载目录。</div>
    </aside>
  </div>

  <section class="card">
    <div class="row">
      <input id="token" type="password" placeholder="ADMIN_TOKEN">
      <button class="button primary" onclick="loadDirectory('')">加载日志目录</button>
    </div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
let source=null;
let raw='';
let paused=false;
let selectedFile='';
let currentDir='';
const MAX_CHARS=500000;

$('token').value=localStorage.getItem('admin_token')||'';

function setStatus(text,ok=false){
  $('status').textContent=text;
  $('dot').classList.toggle('ok',ok);
}

function render(){
  const q=$('filter').value.trim().toLowerCase();
  let text=raw;
  if(q){
    text=raw.split(/\r?\n/).filter(line=>line.toLowerCase().includes(q)).join('\n');
  }
  $('log').textContent=text||'暂无匹配日志';
  if(!paused&&$('autoScroll').checked){
    $('log').scrollTop=$('log').scrollHeight;
  }
}

function add(text){
  raw+=String(text||'');
  if(raw.length>MAX_CHARS) raw=raw.slice(-MAX_CHARS);
  render();
}

function togglePause(){
  paused=!paused;
  $('pauseBtn').textContent=paused?'继续滚动':'暂停滚动';
}

function clearView(){
  raw='';
  render();
}

async function loadDirectory(dir=''){
  const token=$('token').value.trim();
  if(!token){
    setStatus('请输入 ADMIN_TOKEN');
    return;
  }

  localStorage.setItem('admin_token',token);

  try{
    const params=new URLSearchParams({token});
    if(dir) params.set('path',dir);

    const r=await fetch('/api/admin/live-log/tree?'+params.toString());
    const j=await r.json();
    if(!r.ok||j.success===false) throw new Error(j.message||('HTTP '+r.status));

    currentDir=j.path||'';
    renderBreadcrumb();

    const rows=(j.data||[]).map(item=>{
      if(item.type==='directory'){
        return '<button class="log-tree-item folder" data-path="'+escapeHtml(item.path)+'">📁 <span>'+escapeHtml(item.name)+'</span></button>';
      }

      const active=item.path===selectedFile?' active':'';
      return '<button class="log-tree-item file'+active+'" data-file="'+escapeHtml(item.path)+'">📄 <span>'+escapeHtml(item.name)+'</span></button>';
    }).join('');

    $('tree').innerHTML=rows||'<div class="log-tree-empty">这个目录里没有日志</div>';

    $('tree').querySelectorAll('[data-path]').forEach(el=>{
      el.onclick=()=>loadDirectory(el.dataset.path);
    });

    $('tree').querySelectorAll('[data-file]').forEach(el=>{
      el.onclick=()=>{
        selectedFile=el.dataset.file;
        connect();
        loadDirectory(currentDir);
      };
    });
  }catch(e){
    setStatus('日志目录加载失败：'+e.message);
  }
}

function renderBreadcrumb(){
  const parts=currentDir?currentDir.split('/'):[];
  let built='';
  const buttons=['<button data-dir="">根目录</button>'];

  for(const part of parts){
    built=built?built+'/'+part:part;
    buttons.push('<span>›</span><button data-dir="'+escapeHtml(built)+'">'+escapeHtml(part)+'</button>');
  }

  $('breadcrumb').innerHTML=buttons.join('');
  $('breadcrumb').querySelectorAll('[data-dir]').forEach(el=>{
    el.onclick=()=>loadDirectory(el.dataset.dir);
  });
}

function escapeHtml(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#39;");
}

function connect(){
  const token=$('token').value.trim();
  if(!token){alert('请输入 ADMIN_TOKEN');return;}
  localStorage.setItem('admin_token',token);
  source?.close();

  raw='';
  render();
  setStatus('连接中...');

  const params=new URLSearchParams({token});
  if(selectedFile){
    params.set('file',selectedFile);
  }

  source=new EventSource('/api/admin/live-log/stream?'+params.toString());

  source.addEventListener('switch',e=>{
    const data=JSON.parse(e.data);
    $('file').textContent=data.file||'-';
    raw=data.text||'';
    setStatus('实时连接',true);
    render();
  });

  source.addEventListener('append',e=>{
    const data=JSON.parse(e.data);
    add(data.text);
    setStatus('实时连接',true);
  });

  source.addEventListener('status',e=>{
    const data=JSON.parse(e.data);
    setStatus(data.message||'等待中');
  });

  source.onerror=()=>{
    setStatus('连接中断，自动重连...');
  };
}

if($('token').value){
  loadDirectory('');
}
</script>
</body>
</html>
