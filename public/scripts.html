<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>脚本管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container wide">
  <header class="page-header">
    <div>
      <h1>脚本管理</h1>
      <p>通过 PM2 启动、停止和重启 Scan / Mode / 代理池</p>
    </div>
    <div class="actions">
      <a class="button" href="/admin">返回后台</a>
      <a class="button" href="/logs-live">实时日志</a>
      <button class="button" onclick="loadScripts()">刷新状态</button>
    </div>
  </header>

  <section class="card">
    <div class="row">
      <input id="token" type="password" placeholder="ADMIN_TOKEN">
      <button class="button primary" onclick="saveToken()">保存 Token</button>
      <span id="serverState" class="muted">Server 状态：-</span>
    </div>
  </section>

  <section class="card">
    <div id="scriptList">加载中...</div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
function getToken(){return localStorage.getItem('admin_token')||'';}
function saveToken(){
  localStorage.setItem('admin_token',$('token').value.trim());
  loadScripts();
}
$('token').value=getToken();

function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#39;");
}

function fmtDuration(ms){
  ms=Math.max(0,Number(ms)||0);
  const s=Math.floor(ms/1000);
  const d=Math.floor(s/86400);
  const h=Math.floor((s%86400)/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  return (d?d+'天 ':'')+
    String(h).padStart(2,'0')+':'+
    String(m).padStart(2,'0')+':'+
    String(sec).padStart(2,'0');
}

function fmtBytes(n){
  n=Number(n)||0;
  if(n<1024)return n+' B';
  if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(1)+' MB';
}

async function api(url,options={}){
  const headers={
    'Content-Type':'application/json',
    'x-admin-token':getToken(),
    ...(options.headers||{})
  };
  const r=await fetch(url,{...options,headers});
  const j=await r.json().catch(()=>({success:false,message:'服务器返回非 JSON'}));
  if(!r.ok||j.success===false)throw new Error(j.message||('HTTP '+r.status));
  return j;
}

function statusText(status){
  if(status==='online')return ['运行中','ok'];
  if(status==='stopped')return ['已停止','muted'];
  if(status==='errored')return ['异常','bad'];
  if(status==='launching')return ['启动中','warn'];
  if(status==='not_created')return ['未创建','muted'];
  return [status||'未知','warn'];
}

async function loadScripts(){
  try{
    const j=await api('/api/admin/scripts');

    if(j.server){
      const st=statusText(j.server.status);
      $('serverState').innerHTML='Server 状态：<span class="status '+st[1]+'">'+esc(st[0])+'</span>';
    }else{
      $('serverState').textContent='Server 状态：PM2中未找到 weibo-server';
    }

    $('scriptList').innerHTML=(j.data||[]).map(function(item){
      const st=statusText(item.status);
      const running=item.status==='online'||item.status==='launching';

      return '<div class="process-row">'+
        '<div class="process-main">'+
          '<div class="process-name">'+
            '<strong>'+esc(item.name)+'</strong>'+
            '<span class="status '+st[1]+'">'+esc(st[0])+'</span>'+
            (item.oneShot?'<span class="muted">一次性任务</span>':'')+
          '</div>'+
          '<div class="process-meta">'+
            '<span>PM2: '+esc(item.pm2Name)+'</span>'+
            '<span>PID: '+(item.pid??'-')+'</span>'+
            '<span>运行: '+(running?fmtDuration(item.uptimeMs):'-')+'</span>'+
            '<span>CPU: '+Number(item.cpu||0).toFixed(1)+'%</span>'+
            '<span>内存: '+fmtBytes(item.memory)+'</span>'+
            '<span>重启: '+Number(item.restartCount||0)+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="actions">'+
          '<button class="button primary" '+(running?'disabled':'')+
            ' onclick="act(\''+esc(item.key)+'\',\'start\')">启动</button>'+
          '<button class="button" '+(!running?'disabled':'')+
            ' onclick="act(\''+esc(item.key)+'\',\'stop\')">停止</button>'+
          '<button class="button" onclick="act(\''+esc(item.key)+'\',\'restart\')">重启</button>'+
          '<a class="button" href="/logs-live">日志</a>'+
        '</div>'+
      '</div>';
    }).join('')||'<div class="empty">暂无脚本配置</div>';
  }catch(e){
    $('scriptList').innerHTML='<div class="error">'+esc(e.message)+'</div>';
  }
}

async function act(key,action){
  try{
    await api('/api/admin/scripts/'+encodeURIComponent(key)+'/'+action,{method:'POST'});
    await new Promise(r=>setTimeout(r,700));
    loadScripts();
  }catch(e){
    alert(e.message);
  }
}

setInterval(loadScripts,5000);
loadScripts();
</script>
</body>
</html>
