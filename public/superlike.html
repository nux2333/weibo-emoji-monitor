<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    超Like候选池
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>
    body {
      background: #f5f6f8;
      margin: 0;
      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
    }

    .superlike-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }

    .superlike-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 16px 24px;
      min-width: 150px;
      box-shadow:
        0 1px 4px
        rgba(0,0,0,.08);
    }

    .stat-value {
      font-size: 26px;
      font-weight: bold;
    }

    .stat-label {
      margin-top: 6px;
      color: #777;
      font-size: 13px;
    }

    .toolbar {
      background: white;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar input {
      width: 300px;
      max-width: 70%;
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .toolbar button,
    .toolbar select {
      padding: 9px 14px;
      cursor: pointer;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
    }

    .toolbar select {
      width: auto;
    }

    .table-wrap {
      background: white;
      border-radius: 10px;
      overflow-x: auto;
      box-shadow:
        0 1px 4px
        rgba(0,0,0,.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1200px;
      table-layout: fixed;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom:
        1px solid #eee;
      text-align: left;
      vertical-align: top;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    th {
      background: #fafafa;
      position: sticky;
      top: 0;
      white-space: nowrap;
      z-index: 1;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 100px;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 150px;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 34%;
    }

    th:nth-child(4),
    td:nth-child(4) {
      width: 65px;
    }

    th:nth-child(5),
    td:nth-child(5) {
      width: 220px;
    }

    th:nth-child(6),
    td:nth-child(6) {
      width: 100px;
    }

    th:nth-child(7),
    td:nth-child(7),
    th:nth-child(8),
    td:nth-child(8) {
      width: 130px;
    }

    th:nth-child(9),
    td:nth-child(9) {
      width: 90px;
    }

    .post-text {
      line-height: 1.5;
    }

    .uid {
      font-family: monospace;
      word-break: break-all;
    }

    .comment-low {
      font-weight: bold;
    }

    .icon-tag {
      display: inline-block;
      padding: 3px 8px;
      background: #f0f0f0;
      border-radius: 12px;
      font-size: 12px;
      white-space: normal;
      word-break: break-word;
    }

    .no-icon {
      color: #999;
    }

    .unknown-exp {
      color: #aaa;
    }

    .link-button {
      display: inline-block;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      background: #222;
      color: white;
      white-space: nowrap;
    }

    .time {
      font-size: 12px;
      color: #777;
    }

    .pagination {
      background: white;
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow:
        0 1px 4px
        rgba(0,0,0,.08);
    }

    .pagination-info {
      color: #666;
      font-size: 13px;
    }

    .pagination-buttons {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pagination button {
      padding: 7px 11px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    .pagination button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .pagination .page-current {
      background: #222;
      color: white;
      border-color: #222;
    }

    .csv-panel {
      display: none;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .csv-panel.open {
      display: block;
    }

    .csv-title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .csv-columns {
      display: flex;
      gap: 10px 18px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .csv-columns label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 13px;
    }

    .csv-columns input[type="checkbox"] {
      width: auto;
      max-width: none;
    }

    .csv-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .csv-note {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }

    @media(max-width:700px) {
      .superlike-container {
        padding: 14px 8px;
      }

      .toolbar input {
        width: 100%;
        max-width: none;
      }

      .toolbar {
        align-items: stretch;
      }
    }
  </style>

</head>


<body>

<div class="superlike-container">

  <div class="superlike-title">
    超Like候选池
  </div>


  <div class="stats">

    <div class="stat-card">
      <div
        class="stat-value"
        id="totalCount"
      >
        -
      </div>

      <div class="stat-label">
        候选帖子
      </div>
    </div>


    <div class="stat-card">

      <div
        class="stat-value"
        id="userCount"
      >
        -
      </div>

      <div class="stat-label">
        不同用户
      </div>
    </div>


    <div class="stat-card">

      <div
        class="stat-value"
        id="experienceKnown"
      >
        -
      </div>

      <div class="stat-label">
        已有7天经验值
      </div>
    </div>

  </div>


  <div class="toolbar">

    <input
      id="keyword"
      placeholder="搜索UID / 用户名 / 帖子内容"
    >

    <button
      onclick="searchData()"
    >
      搜索
    </button>

    <button
      onclick="clearSearch()"
    >
      清空
    </button>

    <select
      id="pageSize"
      onchange="changePageSize()"
      title="每页条数"
    >
      <option value="20">
        每页20条
      </option>

      <option
        value="50"
        selected
      >
        每页50条
      </option>

      <option value="100">
        每页100条
      </option>

      <option value="200">
        每页200条
      </option>
    </select>

    <button
      onclick="toggleCsvPanel()"
    >
      下载 CSV
    </button>

  </div>


  <div
    class="csv-panel"
    id="csvPanel"
  >

    <div class="csv-title">
      选择需要导出的 Column
    </div>

    <div
      class="csv-columns"
      id="csvColumns"
    >
    </div>

    <div class="csv-actions">

      <button
        onclick="selectAllCsvColumns()"
      >
        全选
      </button>

      <button
        onclick="clearAllCsvColumns()"
      >
        全不选
      </button>

      <button
        onclick="downloadCsv()"
      >
        下载当前搜索结果
      </button>

      <button
        onclick="toggleCsvPanel(false)"
      >
        取消
      </button>

    </div>

    <div class="csv-note">
      CSV 导出的是当前搜索条件下的全部数据，不只导出当前分页。
    </div>

  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>
            用户ID
          </th>

          <th>
            用户名
          </th>

          <th>
            帖子内容
          </th>

          <th>
            评论
          </th>

          <th>
            当前Icon
          </th>

          <th>
            近7天经验值
          </th>

          <th>
            Link
          </th>

        </tr>

      </thead>


      <tbody
        id="tbody"
      >
      </tbody>

    </table>

  </div>


  <div
    class="pagination"
    id="pagination"
  >

    <div
      class="pagination-info"
      id="paginationInfo"
    >
      -
    </div>

    <div
      class="pagination-buttons"
      id="paginationButtons"
    >
    </div>

  </div>

</div>


<script
  src="/superlike.js"
></script>

</body>
</html>
