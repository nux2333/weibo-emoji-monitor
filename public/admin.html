<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>微博 Emoji Monitor - 后台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container">
  <header class="page-header">
    <div><h1>脚本控制台</h1><p>远程管理 Scan / Mode / JYZ / 代理池</p></div>
    <div class="actions">
      <a class="button" href="/scripts">脚本管理</a>
      <a class="button" href="/monitors-admin">Monitor 管理</a>
      <a class="button" href="/logs-live">实时日志</a>
      <a class="button" href="/api-responses">API Response 管理</a>
    </div>
  </header>

  <section class="card">
    <h2>管理员 Token</h2>
    <div class="row"><input id="token" type="password" placeholder="ADMIN_TOKEN"><button class="button" onclick="saveToken()">保存</button></div>
  </section>

  <section class="card">
    <div class="section-title">
      <div>
        <h2>脚本状态</h2>
        <div class="muted">远程管理 Fresh / History / Mode4 / JYZ / 代理池</div>
      </div>
      <div class="actions">
        <button class="button" onclick="loadScripts()">刷新</button>
        <a class="button" href="/scripts">完整脚本管理</a>
      </div>
    </div>
    <div id="scriptList">加载中...</div>
  </section>

</main>
<script>
const $=id=>document.getElementById(id);
function getToken(){return localStorage.getItem('admin_token')||'';}
function saveToken(){localStorage.setItem('admin_token',$('token').value.trim());loadScripts();}
$('token').value=getToken();
async function api(url,options={}){
  const headers={'Content-Type':'application/json','x-admin-token':getToken(),...(options.headers||{})};
  const r=await fetch(url,{...options,headers});
  const j=await r.json().catch(()=>({success:false,message:'服务器返回非 JSON'}));
  if(!r.ok||j.success===false)throw new Error(j.message||`HTTP ${r.status}`); return j;
}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}

function scriptStatus(status){
  if(status==='online')return ['运行中','ok'];
  if(status==='stopped')return ['已停止','muted'];
  if(status==='errored')return ['异常','bad'];
  if(status==='launching')return ['启动中','warn'];
  if(status==='not_created')return ['未创建','muted'];
  return [status||'未知','warn'];
}

async function loadScripts(){
  try{
    const j=await api('/api/admin/scripts');
    $('scriptList').innerHTML=(j.data||[]).map(item=>{
      const st=scriptStatus(item.status);
      const running=item.status==='online'||item.status==='launching';
      return `<div class="process-row">
        <div class="process-main">
          <div class="process-name">
            <strong>${esc(item.name)}</strong>
            <span class="status ${st[1]}">${esc(st[0])}</span>
          </div>
          <div class="process-meta">
            <span>${esc(item.description||'')}</span>
            <span>PID: ${item.pid??'-'}</span>
            <span>重启: ${Number(item.restartCount||0)}</span>
          </div>
        </div>
        <div class="actions">
          <button class="button primary" ${running?'disabled':''} onclick="scriptAct('${esc(item.key)}','start')">启动</button>
          <button class="button" ${!running?'disabled':''} onclick="scriptAct('${esc(item.key)}','stop')">停止</button>
          <button class="button" onclick="scriptAct('${esc(item.key)}','restart')">重启</button>
        </div>
      </div>`;
    }).join('')||'<div class="empty">暂无脚本配置</div>';
  }catch(e){
    $('scriptList').innerHTML=`<div class="error">${esc(e.message)}</div>`;
  }
}

async function scriptAct(key,action){
  try{
    await api('/api/admin/scripts/'+encodeURIComponent(key)+'/'+action,{method:'POST'});
    setTimeout(loadScripts,700);
  }catch(e){alert(e.message);}
}

loadScripts();
setInterval(loadScripts,10000);
</script>
</body>
</html>
