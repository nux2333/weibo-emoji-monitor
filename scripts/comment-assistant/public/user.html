<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comment Assistant 用户端</title>
    <link rel="stylesheet" href="/static/common.css" />
    <style>
      .comment-copy-list { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
      .comment-copy-row { display:flex; align-items:center; gap:8px; }
      .comment-copy-input { flex:1; min-width:0; box-sizing:border-box; padding:9px 11px; border-radius:8px; }
      .comment-copy-remove, .comment-copy-add { width:34px; height:34px; min-width:34px; padding:0; border-radius:50%; font-size:21px; line-height:1; display:inline-flex; align-items:center; justify-content:center; }
      .comment-copy-remove { background:#fff1f1; color:#d33; border:1px solid #f0bcbc; }
      .comment-copy-add { background:#eef6ff; color:#1677ff; border:1px solid #b9d7ff; }
      .comment-copy-footer { display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="fatal" class="fatal"></div>

      <div class="card">
        <div class="row">
          <div>
            <div class="muted">API Token</div>
            <input id="token" type="password" />
          </div>
          <button id="connect">连接</button>
          <button class="blue" id="add">＋ 添加账号</button>
        </div>
        <div id="health" class="muted" style="margin-top: 10px">未连接</div>
      </div>

      <div class="card">
        <div class="top">
          <div style="display: flex; gap: 8px; align-items: center">
            <h2 style="margin: 0">当前可执行账号</h2>
            <span id="accountCount" class="pill">0</span>
          </div>
          <button id="toggleAccounts" class="collapse-toggle" type="button">收起 ▲</button>
        </div>
        <div id="accountPanel" class="account-panel">
          <div class="account-scroll">
            <table class="account-table">
              <thead>
                <tr>
                  <th><input id="selectAllAccounts" type="checkbox" title="全选" /></th>
                  <th>No</th>
                  <th>用户ID</th>
                  <th>用户名</th>
                  <th>登录状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="accounts">
                <tr><td colspan="6" class="muted">请先连接</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="top">
          <div style="display:flex; gap:8px; align-items:center">
            <h2 style="margin:0">评论文案</h2>
            <span id="commentCopyCount" class="pill">1 条</span>
          </div>
          <button id="toggleCommentCopies" class="collapse-toggle" type="button">收起 ▲</button>
        </div>
        <div id="commentCopyPanel" class="collapsible-panel">
          <div id="commentCopyList" class="comment-copy-list"></div>
          <div class="comment-copy-footer">
            <button id="addCommentCopy" class="comment-copy-add" type="button" title="新增文案">＋</button>
            <span class="muted">每条帖子发送前随机选择其中一条</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="top">
          <h2 style="margin: 0">任务列表</h2>
          <button id="toggleAvailableTasks" class="collapse-toggle" type="button">收起 ▲</button>
        </div>
        <div id="availableTasksPanel" class="collapsible-panel">
          <div class="scroll">
            <table class="task-catalog">
              <thead>
                <tr><th>任务</th><th>说明</th><th>执行设置</th></tr>
              </thead>
              <tbody id="availableTasks">
                <tr><td colspan="3" class="muted">请先连接</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="top">
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
            <h2 style="margin: 0">执行结果</h2>
            <button id="interruptAll" class="gray" type="button" style="padding: 5px 10px">中断全部任务</button>
            <button id="clearAllTasks" class="red" type="button" style="padding: 5px 10px">清空所有任务</button>
          </div>
          <button id="toggleResults" class="collapse-toggle" type="button">收起 ▲</button>
        </div>
        <div id="resultsPanel" class="collapsible-panel">
          <div class="scroll">
            <table>
              <thead>
                <tr><th>账号</th><th>任务名</th><th>执行状态</th><th>操作</th></tr>
              </thead>
              <tbody id="tasks"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const listEl = document.getElementById('commentCopyList');
        const countEl = document.getElementById('commentCopyCount');
        const addEl = document.getElementById('addCommentCopy');
        const storageKey = 'commentAssistantRandomCopiesPreview';
        const defaultCopy = '#田栩宁[超话]##微博星宝养成计划##微博星宝#泥嚎～交个朋友吧 ​';
        const oldPreviewCopy = '田栩宁天天开心';

        let copies = (localStorage.getItem(storageKey) || '')
          .split(/\r?\n/)
          .map(v => v.trim())
          .filter(Boolean);
        if (!copies.length || (copies.length === 1 && copies[0] === oldPreviewCopy)) copies = [defaultCopy];

        function persist() {
          localStorage.setItem(storageKey, copies.filter(Boolean).join('\n'));
          countEl.textContent = `${copies.filter(Boolean).length || 1} 条`;
        }

        function syncFromInputs() {
          copies = Array.from(listEl.querySelectorAll('.comment-copy-input')).map(input => input.value.trim());
          persist();
        }

        function render() {
          listEl.innerHTML = '';
          copies.forEach((copy, index) => {
            const row = document.createElement('div');
            row.className = 'comment-copy-row';

            const input = document.createElement('input');
            input.className = 'comment-copy-input';
            input.type = 'text';
            input.value = copy;
            input.placeholder = '请输入评论文案';
            input.addEventListener('input', syncFromInputs);

            const remove = document.createElement('button');
            remove.className = 'comment-copy-remove';
            remove.type = 'button';
            remove.title = '删除这条文案';
            remove.textContent = '−';
            remove.addEventListener('click', () => {
              copies.splice(index, 1);
              if (!copies.length) copies.push(defaultCopy);
              persist();
              render();
            });

            row.append(input, remove);
            listEl.appendChild(row);
          });
          persist();
        }

        addEl.addEventListener('click', () => {
          syncFromInputs();
          copies.push('');
          render();
          const inputs = listEl.querySelectorAll('.comment-copy-input');
          inputs[inputs.length - 1]?.focus();
        });

        const copyPanel = document.getElementById('commentCopyPanel');
        const copyToggle = document.getElementById('toggleCommentCopies');
        const collapseKey = 'commentAssistantCommentCopiesCollapsed';
        function applyCollapse(collapsed) {
          copyPanel.classList.toggle('collapsed', collapsed);
          copyToggle.textContent = collapsed ? '展开 ▼' : '收起 ▲';
        }
        applyCollapse(localStorage.getItem(collapseKey) === '1');
        copyToggle.addEventListener('click', () => {
          const collapsed = !copyPanel.classList.contains('collapsed');
          applyCollapse(collapsed);
          localStorage.setItem(collapseKey, collapsed ? '1' : '0');
        });

        // user.js 不需要感知文案 UI：在领取任务请求发出前自动附加当前文案数组。
        const nativeFetch = window.fetch.bind(window);
        window.fetch = (input, init = {}) => {
          try {
            const url = typeof input === 'string' ? input : String(input?.url || '');
            const method = String(init.method || 'GET').toUpperCase();
            if (method === 'POST' && /^\/api\/(?:tasks\/claim|tasks\/[^/]+\/claim)(?:\?|$)/.test(url)) {
              syncFromInputs();
              const validCopies = copies.map(v => v.trim()).filter(Boolean);
              const body = init.body ? JSON.parse(init.body) : {};
              body.comment_copies = validCopies.length ? validCopies : [defaultCopy];
              init = { ...init, body: JSON.stringify(body) };
            }
          } catch (_) {}
          return nativeFetch(input, init);
        };

        render();
      })();
    </script>
    <script src="/static/common.js"></script>
    <script src="/static/user.js"></script>
  </body>
</html>
