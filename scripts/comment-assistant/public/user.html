<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comment Assistant 用户端</title>
    <link rel="stylesheet" href="/static/common.css" />
  </head>
  <body>
    <div class="wrap">
      <div id="fatal" class="fatal"></div>

      <div class="card">
        <div class="row">
          <div>
            <div class="muted">API Token</div>
            <input id="token" type="password" />
          </div>
          <button id="connect">连接</button>
          <button class="blue" id="add">＋ 添加账号</button>
        </div>
        <div id="health" class="muted" style="margin-top: 10px">未连接</div>
      </div>

      <div class="card">
        <div class="top">
          <div style="display: flex; gap: 8px; align-items: center">
            <h2 style="margin: 0">当前可执行账号</h2>
            <span id="accountCount" class="pill">0</span>
          </div>
          <button id="toggleAccounts" class="collapse-toggle" type="button">收起 ▲</button>
        </div>
        <div id="accountPanel" class="account-panel">
          <div class="account-scroll">
            <table class="account-table">
              <thead>
                <tr>
                  <th><input id="selectAllAccounts" type="checkbox" title="全选" /></th>
                  <th>No</th>
                  <th>用户ID</th>
                  <th>用户名</th>
                  <th>登录状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="accounts">
                <tr><td colspan="6" class="muted">请先连接</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="top">
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
            <h2 style="margin:0">评论文案</h2>
            <span id="commentCopyCount" class="pill">0 条</span>
          </div>
        </div>
        <div style="margin-top:10px">
          <textarea id="commentCopies" rows="7" placeholder="每行一条评论文案，例如：&#10;田栩宁天天开心&#10;今天也来支持一下&#10;期待新的作品" style="width:100%; box-sizing:border-box; resize:vertical; padding:10px; border-radius:8px"></textarea>
          <div class="muted" style="margin-top:6px">每行一条，空行自动忽略。执行评论时将从有效文案中随机选择一条。</div>
          <div style="display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap">
            <button id="saveCommentCopies" class="blue" type="button">保存文案</button>
            <button id="previewRandomComment" class="gray" type="button">随机预览</button>
            <span id="commentCopyStatus" class="muted">当前仅用于页面效果预览</span>
          </div>
          <div id="randomCommentPreview" style="display:none; margin-top:10px; padding:10px; border-radius:8px; background:rgba(127,127,127,.08)"></div>
        </div>
      </div>

      <div class="card">
        <div class="top">
          <h2 style="margin: 0">任务列表</h2>
          <button id="toggleAvailableTasks" class="collapse-toggle" type="button">收起 ▲</button>
        </div>
        <div id="availableTasksPanel" class="collapsible-panel">
          <div class="scroll">
            <table class="task-catalog">
              <thead>
                <tr><th>任务</th><th>说明</th><th>执行设置</th></tr>
              </thead>
              <tbody id="availableTasks">
                <tr><td colspan="3" class="muted">请先连接</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="top">
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
            <h2 style="margin: 0">执行结果</h2>
            <button id="interruptAll" class="gray" type="button" style="padding: 5px 10px">中断全部任务</button>
            <button id="clearAllTasks" class="red" type="button" style="padding: 5px 10px">清空所有任务</button>
          </div>
          <button id="toggleResults" class="collapse-toggle" type="button">收起 ▲</button>
        </div>
        <div id="resultsPanel" class="collapsible-panel">
          <div class="scroll">
            <table>
              <thead>
                <tr><th>账号</th><th>任务名</th><th>执行状态</th><th>操作</th></tr>
              </thead>
              <tbody id="tasks"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const textarea = document.getElementById('commentCopies');
        const count = document.getElementById('commentCopyCount');
        const status = document.getElementById('commentCopyStatus');
        const preview = document.getElementById('randomCommentPreview');
        const storageKey = 'commentAssistantRandomCopiesPreview';

        const values = () => textarea.value
          .split(/\r?\n/)
          .map(v => v.trim())
          .filter(Boolean);

        const refreshCount = () => {
          count.textContent = `${values().length} 条`;
        };

        textarea.value = localStorage.getItem(storageKey) || '';
        refreshCount();
        textarea.addEventListener('input', refreshCount);

        document.getElementById('saveCommentCopies').addEventListener('click', () => {
          const list = values();
          localStorage.setItem(storageKey, list.join('\n'));
          textarea.value = list.join('\n');
          refreshCount();
          status.textContent = `已保存 ${list.length} 条（页面预览）`;
        });

        document.getElementById('previewRandomComment').addEventListener('click', () => {
          const list = values();
          if (!list.length) {
            preview.style.display = 'block';
            preview.textContent = '请先输入至少一条评论文案。';
            return;
          }
          preview.style.display = 'block';
          preview.textContent = list[Math.floor(Math.random() * list.length)];
        });
      })();
    </script>
    <script src="/static/common.js"></script>
    <script src="/static/user.js"></script>
  </body>
</html>
