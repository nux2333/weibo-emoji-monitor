<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comment Assistant Mobile</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:0 auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#777;font-size:13px}.title{font-size:20px;font-weight:700}.progress{font-size:28px;font-weight:700;margin:4px 0 12px}.post{font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word;min-height:120px;background:#fafafa;border-radius:12px;padding:14px}.note{margin-top:10px;font-size:13px;color:#666;white-space:pre-wrap}.input{width:100%;font-size:17px;padding:14px;border:1px solid #d7d7d7;border-radius:12px;outline:none}.btn{width:100%;border:0;border-radius:12px;padding:14px 12px;font-size:16px;font-weight:600;color:#fff;background:#111}.btn.secondary{background:#6b7280}.btn.blue{background:#1677ff}.btn.green{background:#15803d}.btn:disabled{opacity:.45}.gap{height:8px}.hidden{display:none}.ok{color:#15803d}.bad{color:#b91c1c}select,input{font:inherit}.top-input{flex:1;min-width:180px;padding:10px;border:1px solid #ccc;border-radius:9px}.account-select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff}.link{display:inline-block;margin-top:10px;color:#1677ff;text-decoration:none}.status{min-height:20px;margin-top:8px}.hint{font-size:12px;color:#888;margin-top:8px}.task-name{font-size:16px;font-weight:700;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="title">手机手动任务</div>
    <div class="row" style="margin-top:12px">
      <input id="token" class="top-input" type="password" placeholder="API Token">
      <button id="connect" class="btn blue" style="width:auto;padding:10px 16px" type="button">连接</button>
    </div>
    <div id="health" class="muted status">JS 加载中...</div>
  </div>

  <div class="card">
    <div class="muted">账号</div>
    <select id="account" class="account-select"><option value="mobile">mobile</option></select>
  </div>

  <div class="card">
    <div class="muted">默认任务</div>
    <div class="task-name">随机高经验值用户轮询</div>
    <div class="muted">经验值 ≥ 70、评论数 ≤ 19、当天帖子。每次把当前账号的待处理队列补到 20 条。</div>
    <div class="gap"></div>
    <button id="claimDefault" class="btn green" type="button">领取 / 补充 20 条</button>
    <div id="claimStatus" class="status muted"></div>
  </div>

  <div id="taskCard" class="card hidden">
    <div id="progress" class="progress">0 / 0</div>
    <div id="post" class="post"></div>
    <div id="note" class="note"></div>
    <a id="link" class="link" href="#">查看帖子</a>
    <div class="gap"></div>
    <input id="manualText" class="input" autocomplete="off" placeholder="手动记录；按 Enter = 确认完成并下一条">
    <div class="hint">Enter 只代表手动确认完成，不会自动向微博提交评论。</div>
    <div class="gap"></div>
    <button id="done" class="btn blue" type="button">完成并下一条</button>
    <div class="gap"></div>
    <button id="skip" class="btn secondary" type="button">跳过并下一条</button>
    <div id="status" class="status muted"></div>
  </div>

  <div id="empty" class="card hidden">
    <div class="title">当前没有待处理任务</div>
    <div id="emptyProgress" class="muted" style="margin-top:8px"></div>
  </div>
</div>
<script>
(function () {
  function el(id) { return document.getElementById(id); }

  var token = el('token');
  var account = el('account');
  var taskCard = el('taskCard');
  var empty = el('empty');
  var currentTask = null;

  el('health').textContent = 'JS 已启动，等待连接';
  token.value = sessionStorage.getItem('caToken') || '';

  window.addEventListener('error', function (e) {
    el('health').textContent = 'JS错误：' + String(e.message || 'unknown');
    el('health').className = 'bad status';
  });

  window.addEventListener('unhandledrejection', function (e) {
    var msg = e.reason && e.reason.message ? e.reason.message : String(e.reason || 'Promise error');
    el('health').textContent = '请求错误：' + msg;
    el('health').className = 'bad status';
  });

  async function api(url, opt) {
    opt = opt || {};
    var headers = Object.assign({
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token.value.trim()
    }, opt.headers || {});
    var r = await fetch(url, Object.assign({}, opt, { headers: headers }));
    var j;
    try { j = await r.json(); }
    catch (_) { j = { success: false, message: 'HTTP ' + r.status }; }
    if (!r.ok || !j.success) throw new Error(j.message || ('HTTP ' + r.status));
    return j.data;
  }

  function progressText(p) {
    var total = Number(p.total_count || 0);
    var done = Number(p.done_count || 0);
    var skip = Number(p.skipped_count || 0);
    var pending = Number(p.pending_count || 0);
    return {
      main: (done + skip) + ' / ' + total,
      detail: '完成 ' + done + ' ｜ 跳过 ' + skip + ' ｜ 剩余 ' + pending
    };
  }

  function setStatus(text, bad) {
    el('status').textContent = text || '';
    el('status').className = 'status ' + (bad ? 'bad' : 'muted');
  }

  async function loadAccounts() {
    var list = await api('/api/accounts');
    account.innerHTML = '';
    list.forEach(function (x) {
      var o = document.createElement('option');
      o.value = x.account;
      o.textContent = x.account + '（剩余 ' + Number(x.pending_count || 0) + '）';
      account.appendChild(o);
    });
    if (!list.length) {
      var o = document.createElement('option');
      o.value = 'mobile';
      o.textContent = 'mobile（剩余 0）';
      account.appendChild(o);
    }
    var saved = localStorage.getItem('caMobileAccount');
    if (saved && Array.prototype.some.call(account.options, function (x) { return x.value === saved; })) account.value = saved;
    await loadNext();
  }

  async function loadNext() {
    localStorage.setItem('caMobileAccount', account.value || 'mobile');
    var data = await api('/api/next?account=' + encodeURIComponent(account.value || 'mobile'));
    var p = progressText(data.progress || {});
    currentTask = data.task;
    if (!currentTask) {
      taskCard.classList.add('hidden');
      empty.classList.remove('hidden');
      el('emptyProgress').textContent = p.detail + '。点击“领取 / 补充 20 条”开始。';
      return;
    }
    empty.classList.add('hidden');
    taskCard.classList.remove('hidden');
    el('progress').textContent = p.main;
    el('post').textContent = currentTask.post_text || '(无帖子文案)';
    el('note').textContent = (currentTask.note || '') + String.fromCharCode(10) + p.detail;
    var link = el('link');
    if (currentTask.post_link) {
      link.style.display = 'inline-block';
      link.href = currentTask.post_link;
    } else {
      link.style.display = 'none';
      link.href = '#';
    }
    el('manualText').value = '';
    setStatus('');
  }

  async function claimDefault() {
    var button = el('claimDefault');
    button.disabled = true;
    el('claimStatus').textContent = '领取中...';
    el('claimStatus').className = 'status muted';
    try {
      var data = await api('/api/default-task/claim', {
        method: 'POST',
        body: JSON.stringify({ account: account.value || 'mobile' })
      });
      el('claimStatus').textContent = '本次新增 ' + data.count + ' 条，当前待处理 ' + data.pending + '/' + data.target;
      el('claimStatus').className = 'status ok';
      await loadAccounts();
    } catch (e) {
      el('claimStatus').textContent = '领取失败：' + String(e.message);
      el('claimStatus').className = 'status bad';
    } finally {
      button.disabled = false;
    }
  }

  async function finish(action) {
    if (!currentTask) return;
    el('done').disabled = true;
    el('skip').disabled = true;
    try {
      await api('/api/task/' + encodeURIComponent(currentTask.task_id) + '/result', {
        method: 'POST',
        body: JSON.stringify({
          account: account.value || 'mobile',
          action: action,
          manual_text: el('manualText').value
        })
      });
      await loadNext();
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      el('done').disabled = false;
      el('skip').disabled = false;
    }
  }

  async function connect() {
    el('health').textContent = '连接中...';
    el('health').className = 'muted status';
    sessionStorage.setItem('caToken', token.value.trim());
    if (!token.value.trim()) {
      el('health').textContent = '请先输入 API Token';
      el('health').className = 'bad status';
      return;
    }
    try {
      var h = await api('/api/health');
      el('health').textContent = '● 已连接 ' + h.host + ' ｜ 默认任务：' + h.default_task;
      el('health').className = 'ok status';
      await loadAccounts();
    } catch (e) {
      el('health').textContent = '连接失败：' + String(e.message);
      el('health').className = 'bad status';
    }
  }

  el('connect').addEventListener('click', connect);
  el('claimDefault').addEventListener('click', claimDefault);
  account.addEventListener('change', function () {
    loadNext().catch(function (e) {
      el('health').textContent = String(e.message);
      el('health').className = 'bad status';
    });
  });
  el('done').addEventListener('click', function () { finish('done'); });
  el('skip').addEventListener('click', function () { finish('skip'); });
  el('link').addEventListener('click', function (e) {
    if (!currentTask || !currentTask.post_link) {
      e.preventDefault();
      return;
    }
    e.preventDefault();
    window.location.assign(currentTask.post_link);
  });
  el('manualText').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      finish('done');
    }
  });

  if (token.value.trim()) connect();
}());
</script>
</body>
</html>
